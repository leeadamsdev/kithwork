services:
  postgres:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kithwork}
      POSTGRES_USER: ${POSTGRES_USER:-kithwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kithwork_dev}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8.10.3-trixie@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-kithwork_dev}
    command:
      [
        redis-server,
        --appendonly,
        "yes",
        --appendfsync,
        everysec,
        --maxmemory-policy,
        noeviction,
        --requirepass,
        "${REDIS_PASSWORD:-kithwork_dev}",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
