version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Revisit with typescript-eslint upgrades; 8.72.1 supports TypeScript <6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # @fastify/otel 0.21.4 requires the OpenTelemetry 2.x / 0.223.x family.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/context-async-hooks"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/core"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-*"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/instrumentation"
        versions: [">=0.224.0"]
      - dependency-name: "@opentelemetry/instrumentation-http"
        versions: [">=0.224.0"]
      - dependency-name: "@opentelemetry/exporter-*-otlp-proto"
        versions: [">=0.224.0"]
      - dependency-name: "@opentelemetry/instrumentation-pg"
        versions: [">=0.77.0"]
      - dependency-name: "@opentelemetry/instrumentation-pino"
        versions: [">=0.70.0"]
    groups:
      trpc:
        patterns: ["@trpc/*"]
      opentelemetry:
        patterns: ["@opentelemetry/*", "@fastify/otel", "import-in-the-middle"]
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "@typescript-eslint/*"
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      testcontainers:
        patterns:
          - testcontainers
          - "@testcontainers/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Database major upgrades require a deliberate data migration plan.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    groups:
      development-services:
        patterns:
          - "*"
        update-types: [minor, patch]
