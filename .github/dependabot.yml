version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Revisit with typescript-eslint upgrades; 8.72.1 supports TypeScript <6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "@typescript-eslint/*"
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
