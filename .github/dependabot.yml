version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Revisit with typescript-eslint upgrades; 8.72.1 supports TypeScript <6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "@typescript-eslint/*"
          - typescript-eslint
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      testcontainers:
        patterns:
          - testcontainers
          - "@testcontainers/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Database major upgrades require a deliberate data migration plan.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    groups:
      development-services:
        patterns:
          - "*"
        update-types: [minor, patch]
