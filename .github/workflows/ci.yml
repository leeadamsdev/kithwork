name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            tests: test:coverage
          - os: windows-2025
            tests: test:unit
          - os: macos-15
            tests: test:unit
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          dest: ${{ runner.temp }}/pnpm
          node-version-file: .node-version
          require-lockfile: true
          cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dependency-path: |
            .node-version
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Check formatting
        if: runner.os == 'Linux'
        run: pnpm format:check

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level high

      - name: Build, typecheck, and test
        id: checks
        run: pnpm exec turbo run build typecheck test:build "${{ matrix.tests }}" --force

      - name: Typecheck root tooling
        run: pnpm exec tsc --project tsconfig.json

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm exec eslint . --max-warnings 0

      - name: Upload coverage
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.checks.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: |
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
