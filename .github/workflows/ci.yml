name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            tests: test:coverage
          - os: windows-2025
            tests: test:unit
          - os: macos-15
            tests: test:unit
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure pnpm store
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"

      - name: Restore dependency store
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache package content/indexes, not runner-specific project registrations.
          path: |
            ${{ runner.temp }}/pnpm-store/v*/files
            ${{ runner.temp }}/pnpm-store/v*/index*
          key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          dest: ${{ runner.temp }}/pnpm
          node-version-file: .node-version
          require-lockfile: true
          cache: false

      - name: Check formatting
        if: runner.os == 'Linux'
        run: pnpm format:check

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --audit-level high

      - name: Build, typecheck, and test
        id: checks
        run: pnpm exec turbo run build typecheck test:build "${{ matrix.tests }}" --force

      - name: Check repository tooling
        run: |
          pnpm exec tsc --project tsconfig.json
          pnpm exec tsc --project tests/tsconfig.json
          pnpm exec vitest run --project tooling
          pnpm db:check

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm exec eslint . --max-warnings 0

      - name: Validate services and run integration tests
        id: integration
        if: runner.os == 'Linux'
        run: |
          docker compose config --quiet
          pnpm exec vitest run --project integration --coverage

      - name: Upload integration diagnostics
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.integration.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics
          path: test-results/integration/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save dependency store
        if: github.ref == 'refs/heads/main' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pnpm-store/v*/files
            ${{ runner.temp }}/pnpm-store/v*/index*
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Upload coverage
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.checks.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: |
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
            apps/*/coverage/lcov.info
            apps/*/coverage/coverage-summary.json
            coverage/integration/lcov.info
            coverage/integration/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
