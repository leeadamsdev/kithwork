packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": 26.6.6
  typescript: 6.0.3
  vitest: 5.1.0

overrides:
  # Kit 0.31.11 uses tsx; this unused legacy dependency pulls deprecated loaders.
  "drizzle-kit@0.31.11>@esbuild-kit/esm-loader": "-"
  # GHSA-3g3m-2fjr-6pw4: remove once React Email's CLI accepts patched glob.
  "react-email@6.11.6>glob": 14.0.2
  # GHSA-g3hv-75wg-m249: remove once the lint tooling adopts patched minimatch.
  "minimatch@10.2.6": 11.0.3
  # Testcontainers archive dependencies: GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249.
  "archiver-utils@5.0.2>glob": 14.0.2
  "minimatch@5.1.9": 11.0.3

allowBuilds:
  esbuild: true
  msgpackr-extract@3.0.6: true
  # Optional SSH accelerators are unnecessary for local Docker engines.
  cpu-features: false
  ssh2: false
  protobufjs: true

engineStrict: true
# Resolve dependency engines against our target, including on Dependabot's older host.
nodeVersion: 26.13.0
pmOnFail: error
saveExact: true
strictDepBuilds: true
strictPeerDependencies: true
minimumReleaseAgeExclude:
  - "@vitest/coverage-v8@5.1.0"
  - "@vitest/mocker@5.1.0"
  - "@vitest/spy@5.1.0"
  - vitest@5.1.0
